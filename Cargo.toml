[package]
name = "unified-archive"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["YongJoon Joe <developer@yongjoon.net>"]
license = "MIT"
description = "Unified archive library for Rust — read and extract ZIP/7z/RAR/TAR (gz/bz2/xz/zst/lz4/lzma)/ISO and standalone .gz/.bz2/.xz/.zst/.lz4/.lzma; create ZIP/7z/TAR (gz/bz2/xz/zst/lz4/lzma) and modify ZIP/7z. RAR is read-only via the main facade (creation requires the optional external-rar-create feature on Windows)."
repository = "https://github.com/QuietJoon/unified-archive"
keywords = ["archive", "7zip", "compression", "extraction", "unified"]
categories = ["compression", "filesystem"]

[dependencies]
once_cell = "1.20"
crc32fast = "1.4"
secstr = "0.5"
walkdir = "2.4"
sevenz-rust2 = { version = "0.19", optional = true }  # Native Rust 7z backend with CRC32 metadata access (maintained fork); gated by the `sevenzip` feature
zip = { version = "2.2", default-features = false, features = ["deflate"] }  # Native Rust ZIP backend — sole reader/extractor + creator for all ZIP; AES read is the `zip-crypto` feature
tempfile = "3.0"  # Atomic write helper backing AtomicOutputFile and modification temp paths
fs4 = "1"  # Advisory file locking for Modify mode (MADR-0009, MADR-0016); maintained fs2 successor

# R0076-0022: libarchive_wrapper.rs uses `libc::_open_osfhandle` and
# `libc::_close` on the Windows arm of the libarchive write constructor.
# OI-0065-001 keeps the Windows libarchive build deferred, so this branch
# is not reached by default CI, but the dependency must be declared so a
# Windows-target compile probe doesn't fail with E0432.
[target.'cfg(windows)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
serial_test = { version = "3", features = ["file_locks"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }  # Integration tests that poke ZIP metadata directly (archive comment, compression method)

[build-dependencies]
pkg-config = "0.3"
cc = "1"

[features]
# AD 0058 Stage 1, format features. `default` grows to reproduce today's exact
# capability set, which is a re-expression and not a "flip": ordering constraint 2
# protects against the default set LOSING capability before both profiles are
# proven, and nothing observable changes here (AD-0058, 2026-09-06 amendment).
default = ["rar-support", "v2-api", "sevenzip", "zip-crypto", "libarchive"]
rar-support = []  # RAR/RAR5 support (requires UnRAR license compliance)
sevenzip = ["dep:sevenz-rust2"]  # 7z read/extract/create via the native Rust backend
zip-crypto = ["zip/aes-crypto"]  # WinZip-AES encrypted ZIP reading
# TAR family, raw single-file compressed formats, ISO — and, per AD-0071,
# ZIP/7z modification, which binds this backend unconditionally. Turning it
# off removes the system libarchive dependency and its build.rs probe, so a
# read-only ZIP/7z consumer needs no C library present at build time.
libarchive = []
external-rar-create = []  # RAR creation via external WinRAR CLI (Windows only)
# D2 typed-handle split (ReadArchive / WriteArchive / ModifyArchive). Additive since v0.3;
# on by default since 2026-09-03 (owner ruling). `--no-default-features` turns it off.
#
# The flip is NOT blocked on CI (AD-0070, 2026-09-03). This comment used to say
# it was: "AD 0058 ordering constraint 2 forbids flipping default features until
# the read-minimal and full profiles have CI coverage, and this repository has no
# CI". Two things were wrong with that. Constraint 2 was written about AD 0058's
# FOOTPRINT features, and borrowing it for `v2-api` imported a condition that has
# nothing to do with this flag — `v2-api` gates a module, two cfg sites and a set
# of in-crate tests, and no platform-specific code at all. And "no CI" was never
# the real obstacle: both sides of this flip are observable on any dev host.
#
# What the flip actually needs is that both sides are RUN. As of 2026-09-03 they
# are: `cargo test --all-features` (v2 on) and `cargo test --no-default-features`
# (v2 off) are both release-gate lanes in scripts/release-gate.sh, and the
# minimal profile was made clippy-clean in the same pass — eight test files had
# dangling imports on it, because nobody had ever built it.
#
# FLIPPED ON BY DEFAULT 2026-09-03 (owner ruling, migration step 3). Both sides
# stay covered: `--all-features` builds it, `--no-default-features` does not,
# and both are release-gate lanes. Integration coverage was added in the same
# pass — before the flip `v2-api` had in-crate tests only, which is thin for a
# default.
#
# Migration step 4 — remove this flag and the legacy `Archive` facade — is NOT
# a flag deletion and cannot be done from here. `ReadArchive`, `WriteArchive`
# and `ModifyArchive` are implemented by WRAPPING `Archive` (`inner: Archive`,
# and roughly thirty of ReadArchive's methods delegate straight to it), so
# deleting the facade means giving them a real implementation first — the
# `ReadArchiveBackend` / `WriteArchiveBackend` split that AD-0053's D2 planned
# and that was never built. `Archive` also carries no `#[deprecated]` at all, so
# a removal today would be a removal with no deprecation cycle behind it. The
# good news is the public v2 surface is already clean: `Archive` leaks only
# through two private helpers.
v2-api = []

[[example]]
name = "inspect_archive"
path = "examples/inspect_archive.rs"

[[example]]
name = "extract_archive"
path = "examples/extract_archive.rs"

[[example]]
name = "create_archive"
path = "examples/create_archive.rs"

[[example]]
name = "modify_archive"
path = "examples/modify_archive.rs"

[[bench]]
name = "archive_operations"
harness = false

[[bench]]
name = "integrity_validation_bench"
harness = false

[[bench]]
name = "sfx_detection"
harness = false

